name: Bot 2 - ema_elder_ray

on:
  schedule:
    - cron: '0 * * * *'   # cada hora en punto
  workflow_dispatch:      # ejecución manual con un clic

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar estrategia
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_bot.py ema_elder_ray

      - name: Guardar estado de alerta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "Actualiza estado ema_elder_ray"
            git pull --rebase
            git push
          fi
